name: 构建油猴脚本

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 Release tag（例如 v2.0.2.0）；留空则仅构建不发布'
        required: false
        default: ''

jobs:
  build:
    name: 构建与校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 构建单个脚本
        run: npm run build

      - name: 语法检查
        run: node --check dist/enhance.user.js

      - name: 校验产物与源码是否同步
        run: |
          # 仅比较有效内容，忽略行尾差异（Windows / Linux 换行不同不应判为失败）
          if ! git diff --quiet --ignore-cr-at-eol -- dist enhance.js; then
            echo "::error::构建产物与源码不同步。请在本地执行 npm run build 并提交 dist/enhance.user.js 与 enhance.js"
            git diff --stat -- dist enhance.js
            git diff --ignore-cr-at-eol -- dist enhance.js | head -60
            exit 1
          fi
          echo "产物已是最新"

      - name: 上传构建产物（workflow artifact）
        uses: actions/upload-artifact@v4
        with:
          name: enhance-user-js
          path: dist/enhance.user.js
          retention-days: 90

  release:
    name: 发布 Release 附件
    # 打 v* tag 时自动发布；也可在 Actions 页面手动触发并指定 tag 补发
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 构建单个脚本
        run: npm run build

      - name: 列出产物（便于排查）
        run: ls -l dist

      - name: 上传 Release 附件
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
          files: dist/enhance.user.js
